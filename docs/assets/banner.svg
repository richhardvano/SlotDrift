<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-labelledby="sd-banner-title sd-banner-desc">
  <!-- palette: warm paper and ink from the ledger subject; moss for orphaned blocks and one rust accent on the duplicated-slot bracket. contrast against #F7F3EC: ink #33302B 11.5:1, moss #5E6B5A 5.1:1, rust #9C3D12 6.1:1. motion: the report line under the ribbon types itself during the first part of the loop and then holds, encoding the report being written after the scan; with reduced motion the line is fully visible. every number comes from running the CLI on samples/cluster-window.jsonl. -->
  <title id="sd-banner-title">SlotDrift banner: the cluster window and its report line</title>
  <desc id="sd-banner-desc">The SlotDrift wordmark, the 61-slot sample window drawn as one cell per slot with skipped slots pale, orphaned slots in moss and a rust bracket under the duplicated slots, and the real summary line records 64 findings 12 under the ribbon.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #sd-type-rect { animation: sd-type 8s steps(30, end) infinite; }
    }
    @keyframes sd-type {
      0% { width: 0; }
      30% { width: 180; }
      100% { width: 180; }
    }
  </style>
  <defs>
    <clipPath id="sd-type-clip"><rect id="sd-type-rect" x="128" y="118" width="180" height="16"/></clipPath>
  </defs>
  <rect width="640" height="176" fill="#F7F3EC"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="16" y="52" fill="#33302B">slot</text>
    <text x="65" y="52" fill="#9C3D12">drift</text>
  </g>
  <text x="16" y="74" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5E6B5A">continuity, forks, findings</text>

  <text x="128" y="32" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#33302B">61 slots, 64 records</text>

  <g stroke="#33302B" stroke-width="1">
    <g fill="#F7F3EC">
      <rect x="128" y="48" width="6" height="24"/>
      <rect x="136" y="48" width="6" height="24"/>
      <rect x="144" y="48" width="6" height="24"/>
      <rect x="152" y="48" width="6" height="24"/>
      <rect x="160" y="48" width="6" height="24"/>
      <rect x="168" y="48" width="6" height="24"/>
      <rect x="176" y="48" width="6" height="24"/>
      <rect x="184" y="48" width="6" height="24"/>
      <rect x="192" y="48" width="6" height="24"/>
      <rect x="200" y="48" width="6" height="24"/>
